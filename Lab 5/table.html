<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Table</title>
  <style>
    #customers {
      font-family: Arial, Helvetica, sans-serif;
      border-collapse: collapse;
      width: 100%;
    }

    #customers td, #customers th {
      border: 1px solid #ddd;
      padding: 8px;
    }

    #customers tbody tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    #customers tbody tr:hover {
      background-color: #faf79f;
    }

    #customers th {
      padding-top: 12px;
      padding-bottom: 12px;
      text-transform: uppercase;
      text-align: center;
      background-color: #08d38c;
      color: white;
    }
  </style>
</head>
<body>
  <table id="customers">
    <thead>
      <tr>
        <th scope="col">Company</th>
        <th scope="col">Contact</th>
        <th scope="col">Country</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Alfreds Futterkiste</td>
        <td>Maria Anders</td>
        <td>Germany</td>
      </tr>
      <tr>
        <td>Ernst Handel</td>
        <td>Roland Mendel</td>
        <td>Austria</td>
      </tr>
      <tr>
        <td>Island Trading</td>
        <td>Helen Bennett</td>
        <td>UK</td>
      </tr>
      <tr>
        <td>Magazzini Riuniti</td>
        <td>Giovanni Rovelli</td>
        <td>Italy</td>
      </tr>
    </tbody>
  </table>
</body>
</html>

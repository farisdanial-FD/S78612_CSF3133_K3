<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Atribut Input dalam HTML5</title>
</head>
<body>
    <form>
        Nama Pelajar: <input type="text" name="namaPelajar" placeholder="Masukkan nama pelajar di sini." autofocus autocomplete="on">
        <br><br>
        Nama Bapa: <input type="text" name="namabapa" placeholder="Masukkan nama bapa pelajar di sini." required>
        <br><br>
        <input type="submit" value="Simpan">
    </form>
</body>
</html>
